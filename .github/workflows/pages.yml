name: Pubblica NFC Reader web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copia solo l'app web nella pubblicazione
        shell: bash
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp -R assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
